<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function () {
      var basePath = "/";
      if (location.hostname.endsWith("github.io")) {
        basePath = "/AoE-Problem-Solving/";
      }
      var base = document.createElement("base");
      base.href = basePath;
      document.head.appendChild(base);
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ice Breaker Roulette · AoE Problem Solving</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header site-header--compact">
    <div class="container">
      <a class="back-link" href="index.html">← All tools</a>
      <h1>Ice Breaker Roulette</h1>
      <p class="lead">Pick a style, then spin the wheel for a conversation starter.</p>
    </div>
  </header>

  <main class="container roulette-page">
    <fieldset class="mode-picker">
      <legend class="mode-picker__legend">Choose your roulette</legend>
      <div class="mode-picker__options">
        <label class="mode-option">
          <input type="radio" name="roulette-mode" value="regular" checked>
          <span class="mode-option__label">Regular ice breaker roulette</span>
          <span class="mode-option__hint">Random questions for any meeting</span>
        </label>
        <label class="mode-option">
          <input type="radio" name="roulette-mode" value="charlie">
          <span class="mode-option__label">Charlie inspired ice breaker roulette</span>
          <span class="mode-option__hint">Wood carving energy only</span>
        </label>
      </div>
    </fieldset>

    <section class="roulette-panel" aria-live="polite">
      <div class="wheel-wrap">
        <canvas id="wheel" width="420" height="420" aria-hidden="true"></canvas>
        <div class="wheel-pointer" aria-hidden="true"></div>
      </div>

      <div class="roulette-controls">
        <button id="spin-btn" type="button" class="btn btn-primary">Spin the wheel</button>
        <p id="spin-status" class="spin-status">Ready when you are.</p>
      </div>

      <article id="result-card" class="result-card result-card--hidden">
        <p class="result-label">Your ice breaker</p>
        <p id="result-text" class="result-text"></p>
      </article>
    </section>
  </main>

  <script src="js/roulette.js"></script>
</body>
</html>
